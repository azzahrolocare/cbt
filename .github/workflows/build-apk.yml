name: Build Cordova APK (Live Repo Wrapper)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova Global
        run: npm install -g cordova

      - name: Generate Cordova Project Architecture
        run: |
          # 1. Membuat project cordova baru bernama cbt-live-app
          cordova create cbt-live-app id.web.azzahro.cbt "CBT Az-Zahro"
          cd cbt-live-app

          # 2. Setup config.xml agar target utamanya langsung ke URL GitHub Pages / Custom Domain Anda
          # Sehingga APK akan selalu membaca file HTML dari internet, bukan dari internal handphone
          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="id.web.azzahro.cbt" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>SmartGrader Az-Zahro</name>
              <description>Aplikasi CBT Az-Zahro Live Wrapper</description>
              <author email="admin@azzahro.web.id" href="https://azzahro.web.id">Rahmattullah</author>
              
              <!-- PENTING: Mengarah ke domain utama, sehingga file index.html di repo GitHub yang akan dibaca pertama kali -->
              <content src="https://azzahro.web.id/cbt/" />
              
              <!-- Izinkan akses penuh ke domain dan seluruh jalurnya -->
              <access origin="https://azzahro.web.id/*" />
              <allow-navigation href="https://azzahro.web.id/*" />
              <allow-intent href="https://azzahro.web.id/*" />
              
              <preference name="LogLevel" value="DEBUG" />
              <preference name="Fullscreen" value="true" />
              <preference name="Orientation" value="portrait" />
          </widget>
          EOF

          # 3. Buat file dummy internal agar build tidak error (tidak akan terpakai karena ditimpa content src di atas)
          cat << 'EOF' > www/index.html
          <!DOCTYPE html><html><head><meta charset="utf-8"></head><body>Loading...</body></html>
          EOF

      - name: Add Android Platform and Build APK
        run: |
          cd cbt-live-app
          cordova platform add android@12.0.0 --save
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBT-AzZahro-Live-APK
          path: cbt-live-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
